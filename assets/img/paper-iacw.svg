<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">IACW intent-aware watermarking</title>
  <desc id="desc">An abstract diagram showing editing and generation intents converging into a verifiable watermark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#173f5f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="168" cy="145" r="76" fill="#5ad2d4" opacity=".18" stroke="#78e3e5" stroke-width="4"/>
  <circle cx="472" cy="145" r="76" fill="#f6c85f" opacity=".17" stroke="#f6c85f" stroke-width="4"/>
  <path d="M242 145h56m44 0h56" stroke="#d8f3f4" stroke-width="8" stroke-linecap="round"/>
  <path d="M320 91c34 0 61 24 61 54s-27 54-61 54-61-24-61-54 27-54 61-54z" fill="#fff" opacity=".12" stroke="#fff" stroke-width="4"/>
  <path d="M296 145c12-24 36-24 48 0-12 24-36 24-48 0z" fill="none" stroke="#fff" stroke-width="5"/>
  <circle cx="320" cy="145" r="8" fill="#f6c85f"/>
  <text x="168" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#d8f3f4">EDIT</text>
  <text x="472" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff1bd">GENERATE</text>
  <text x="40" y="284" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Intent-Aware Watermarking</text>
  <text x="42" y="320" font-family="Arial, sans-serif" font-size="20" fill="#a9dfe1">Fine-grained authorial intent attribution</text>
</svg>
